<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Form Auto-Filler</title>
  <link rel="stylesheet" href="../src/popup/popup.css" />
</head>
<body>
  <div class="app" id="app">

    <!-- Header -->
    <header class="header">
      <div class="header__logo">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="16" y1="13" x2="8" y2="13"/>
          <line x1="16" y1="17" x2="8" y2="17"/>
          <polyline points="10 9 9 9 8 9"/>
        </svg>
        <span class="header__title">Smart Auto-Filler</span>
      </div>
      <a href="#" id="open-options" class="header__settings" aria-label="Open settings">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.32 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </a>
    </header>

    <!-- Status Banner -->
    <div class="banner banner--hidden" id="status-banner" role="status" aria-live="polite"></div>

    <!-- Profile Selector Bar -->
    <div class="profile-bar">
      <select class="profile-select" id="profile-select" aria-label="Select profile"></select>
      <button class="icon-btn" id="new-profile-btn" aria-label="Create new profile" title="New profile">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
      <button class="icon-btn icon-btn--danger" id="delete-profile-btn" aria-label="Delete current profile" title="Delete profile">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>
      </button>
    </div>

    <!-- Profile Form -->
    <form id="profile-form" class="profile-form" novalidate autocomplete="off">
      <div class="field-grid">
        <h3 class="section-title" style="grid-column: 1 / -1; margin-bottom: 5px; border-bottom: 1px solid #ccc; padding-bottom: 5px;">Personal Information</h3>
        <div class="field-group">
          <label class="field-label" for="field-first-name">First Name</label>
          <input class="field-input" type="text" id="field-first-name" name="FIRST_NAME" placeholder="John" />
        </div>
        <div class="field-group">
          <label class="field-label" for="field-middle-name">Middle Name</label>
          <input class="field-input" type="text" id="field-middle-name" name="MIDDLE_NAME" placeholder="William" />
        </div>
        <div class="field-group">
          <label class="field-label" for="field-last-name">Last Name</label>
          <input class="field-input" type="text" id="field-last-name" name="LAST_NAME" placeholder="Doe" />
        </div>
        <div class="field-group field-group--full">
          <label class="field-label" for="field-full-name">Full Name</label>
          <input class="field-input" type="text" id="field-full-name" name="FULL_NAME" placeholder="John William Doe" />
        </div>
        

        <div class="field-group">
          <label class="field-label" for="field-gender">Gender</label>
          <select class="field-input" id="field-gender" name="GENDER">
            <option value="">Select...</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Non-binary">Non-binary</option>
            <option value="Other">Other</option>
            <option value="Prefer not to say">Prefer not to say</option>
          </select>
        </div>
        
        <div class="field-group">
          <label class="field-label" for="field-dob">Date of Birth</label>
          <input class="field-input" type="date" id="field-dob" name="DOB" />
        </div>

        <!-- FAMILY INFORMATION -->
        <h3 class="section-title" style="grid-column: 1 / -1; margin-top: 15px; margin-bottom: 5px; border-bottom: 1px solid #ccc; padding-bottom: 5px;">Family Information</h3>
        
        <div class="field-group">
          <label class="field-label">Father's Name</label>
          <input class="field-input" type="text" name="FATHER_NAME" />
        </div>
        <div class="field-group">
          <label class="field-label">Mother's Name</label>
          <input class="field-input" type="text" name="MOTHER_NAME" />
        </div>
        <div class="field-group">
          <label class="field-label">Parent's Name</label>
          <input class="field-input" type="text" name="PARENT_NAME" />
        </div>
        <div class="field-group">
          <label class="field-label">Guardian's Name</label>
          <input class="field-input" type="text" name="GUARDIAN_NAME" />
        </div>

        <h3 class="section-title" style="grid-column: 1 / -1; margin-top: 15px; margin-bottom: 5px; border-bottom: 1px solid #ccc; padding-bottom: 5px;">Education</h3>

        <div class="field-group">
          <label class="field-label">School Name</label>
          <input class="field-input" type="text" name="SCHOOL_NAME" />
        </div>
        <div class="field-group">
          <label class="field-label">College Name</label>
          <input class="field-input" type="text" name="COLLEGE_NAME" />
        </div>
        <div class="field-group">
          <label class="field-label">University Name</label>
          <input class="field-input" type="text" name="UNIVERSITY_NAME" />
        </div>
        <div class="field-group">
          <label class="field-label">Department Name</label>
          <input class="field-input" type="text" name="DEPARTMENT_NAME" />
        </div>
        <div class="field-group">
          <label class="field-label">Course Name</label>
          <input class="field-input" type="text" name="COURSE_NAME" />
        </div>
        <div class="field-group">
          <label class="field-label">Roll Number</label>
          <input class="field-input" type="text" name="ROLL_NUMBER" />
        </div>
        <div class="field-group">
          <label class="field-label">Registration Number</label>
          <input class="field-input" type="text" name="REGISTRATION_NUMBER" />
        </div>


        <h3 class="section-title" style="grid-column: 1 / -1; margin-top: 15px; margin-bottom: 5px; border-bottom: 1px solid #ccc; padding-bottom: 5px;">Contact</h3>

        <div class="field-group field-group--full">
          <label class="field-label" for="field-email">Email</label>
          <input class="field-input" type="email" id="field-email" name="EMAIL" placeholder="john@example.com" />
        </div>

        <div class="field-group field-group--full">
          <label class="field-label" for="field-country-code">Country Code</label>
          <input class="field-input" type="text" id="field-country-code" name="COUNTRY_CODE" placeholder="+1" />
        </div>
        <div class="field-group field-group--full">
          <label class="field-label" for="field-phone">Phone Number</label>
          <input class="field-input" type="tel" id="field-phone" name="PHONE" placeholder="+1 234 567 8900" />
        </div>


        <h3 class="section-title" style="grid-column: 1 / -1; margin-top: 15px; margin-bottom: 5px; border-bottom: 1px solid #ccc; padding-bottom: 5px;">Address</h3>
        
        <div class="field-group field-group--full">
          <label class="field-label">Address Line 1</label>
          <input class="field-input" type="text" name="ADDRESS_LINE1" />
        </div>
        <div class="field-group field-group--full">
          <label class="field-label">Address Line 2</label>
          <input class="field-input" type="text" name="ADDRESS_LINE2" />
        </div>
        <div class="field-group">
          <label class="field-label">City</label>
          <input class="field-input" type="text" name="CITY" />
        </div>
        <div class="field-group">
          <label class="field-label">State</label>
          <input class="field-input" type="text" name="STATE" />
        </div>
        <div class="field-group">
          <label class="field-label">PIN Code</label>
          <input class="field-input" type="text" name="ZIP_CODE" />
        </div>
        <div class="field-group">
          <label class="field-label">Country</label>
          <input class="field-input" type="text" name="COUNTRY" />
        </div>

      </div>
    </form>

    <!-- Actions -->
    <div class="actions">
      <button class="btn btn--secondary" id="save-btn" type="button" aria-label="Save profile">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
          <polyline points="17 21 17 13 7 13 7 21"/>
          <polyline points="7 3 7 8 15 8"/>
        </svg>
        Save
      </button>
      <button class="btn btn--primary" id="fill-btn" type="button" aria-label="Fill form on current page">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 20h9"/>
          <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
        </svg>
        Fill Form
      </button>
    </div>

    <!-- Footer -->
    <footer class="footer">
      <span id="field-count">Detecting fields…</span>
    </footer>

  </div>
  <script type="module" src="../src/popup/popup.ts"></script>
</body>
</html>
